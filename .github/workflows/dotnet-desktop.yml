name: .NET Build

permissions:
  contents: write

on:
  push:
    branches:
      - master
    tags:
      - 'v*'

  pull_request:
    branches:
      - master

jobs:
  build:
    runs-on: windows-latest

    env:
      Solution_Name: Download_all_Kursbuecher_DB.slnx

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore $env:Solution_Name

      - name: Build
        run: dotnet build $env:Solution_Name --configuration Release --no-restore

      - name: Test
        run: dotnet test $env:Solution_Name --configuration Release --no-build

      - name: Publish
        run: |
          dotnet publish $env:Solution_Name `
            --configuration Release `
            -r win-x64 `
            --self-contained true `
            -o publish

      - name: Create ZIP
        run: |
          Compress-Archive `
            -Path publish\* `
            -DestinationPath Download_all_Kursbuecher_DB_win.zip

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Download_all_Kursbuecher_DB
          path: Download_all_Kursbuecher_DB.zip

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: Download_all_Kursbuecher_DB_win.zip
